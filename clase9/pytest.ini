[pytest]
# Dónde buscar los tests y desde dónde importar utils/
testpaths = tests
pythonpath = .
# Siempre en modo detallado y con reporte HTML autocontenido (incluye las capturas)
addopts = -v --html=reports/reporte.html --self-contained-html
# Logs: se ven en el reporte HTML y además quedan en reports/ejecucion.log
log_level = INFO
log_file = reports/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
