[pytest]
# Dónde buscar los tests y desde dónde importar utils/
testpaths = tests
pythonpath = .
# Logs de ejecución: quedan en reports/ejecucion.log
log_level = INFO
log_file = reports/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
